<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ask for permission — Trust Shield Child Edition</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100vh; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at 20% 10%, #0d1b3b 0%, #00030b 60%);
      color: #f5f8ff; display: flex; align-items: center; justify-content: center; padding: 32px;
    }
    .card {
      max-width: 720px; width: 100%;
      background: rgba(10,15,35,.9);
      border: 2px solid rgba(96,165,250,.6);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 40px 120px rgba(59,130,246,.25);
    }
    .icon { font-size: 64px; text-align:center; margin-bottom: 8px; }
    h1 { font-size: clamp(28px, 4vw, 44px); margin: 4px 0 6px; text-align:center; font-weight: 900; letter-spacing: -.02em; }
    .from { text-align:center; font-size: 14px; color: #93c5fd; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 20px; }
    .url {
      background: #000814; border:1px solid rgba(96,165,250,.35);
      padding: 12px 14px; border-radius: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 14px; word-break: break-all; color:#fff; margin-bottom: 20px;
    }
    label { display:block; font-weight:700; margin: 12px 0 8px; }
    textarea {
      width:100%; padding:12px 14px; border-radius:12px;
      border:1px solid rgba(96,165,250,.4); background:#00040d; color:#fff;
      font-family: inherit; font-size:15px; resize: vertical; min-height: 140px;
    }
    .btns { display:flex; gap:12px; flex-wrap:wrap; justify-content:flex-end; margin-top: 16px; }
    button {
      cursor:pointer; padding: 12px 20px; border-radius: 12px; font-weight:700; font-size:15px;
      border: 1px solid transparent;
    }
    .primary { background:#3b82f6; color:white; }
    .primary:hover { background:#2563eb; }
    .primary:disabled { opacity:.6; cursor:not-allowed; }
    .ghost { background: transparent; color:#bfdbfe; border-color: rgba(96,165,250,.4); }
    .ghost:hover { background: rgba(59,130,246,.12); }
    #status { margin-top: 14px; font-size: 14px; color:#93c5fd; min-height: 20px; }
    .ok { color:#86efac !important; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🙋</div>
    <h1>Ask for permission</h1>
    <div class="from">Trust Shield • Child Edition</div>
    <div>Site you want to visit:</div>
    <div class="url" id="url">—</div>
    <label for="reason">Write why you want this website unblocked</label>
    <textarea id="reason" placeholder="e.g. It's for a school project about…"></textarea>
    <div class="btns">
      <button class="ghost" id="cancel">Cancel</button>
      <button class="primary" id="send">Send request to parent</button>
    </div>
    <div id="status"></div>
  </div>
  <script src="ask-permission.js"></script>
</body>
</html>
