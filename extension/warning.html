<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Trust Shield — Dangerous site blocked</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at 20% 10%, #1e293b 0%, #020617 60%);
      color: #e2e8f0; display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      max-width: 640px; width: 100%; background: rgba(15,23,42,.85);
      border: 1px solid rgba(239,68,68,.4); border-radius: 20px;
      padding: 32px; box-shadow: 0 30px 80px rgba(0,0,0,.5);
    }
    .badge { display:inline-flex; align-items:center; gap:8px; padding: 6px 12px; border-radius: 999px;
      background: rgba(239,68,68,.15); color:#fca5a5; font-size: 12px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; }
    h1 { font-size: 28px; margin: 16px 0 8px; }
    p.sub { color:#94a3b8; margin: 0 0 20px; }
    .url { background: #0f172a; border:1px solid #1e293b; padding: 10px 12px; border-radius: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; color:#e2e8f0; }
    ul { margin: 16px 0 24px; padding-left: 20px; color:#cbd5e1; }
    li { margin: 6px 0; }
    .risk { display:flex; align-items:center; gap:10px; margin: 16px 0; }
    .bar { flex:1; height: 8px; background:#1e293b; border-radius:999px; overflow:hidden; }
    .fill { height:100%; background: linear-gradient(90deg,#f59e0b,#ef4444); }
    .btns { display:flex; gap:12px; flex-wrap:wrap; }
    button, a.btn {
      cursor:pointer; padding: 11px 18px; border-radius: 10px; font-weight:600; font-size:14px;
      border: 1px solid transparent; text-decoration:none; display:inline-flex; align-items:center; gap:8px;
    }
    .primary { background:#3b82f6; color:white; }
    .primary:hover { background:#2563eb; }
    .ghost { background: transparent; color:#e2e8f0; border-color:#334155; }
    .ghost:hover { background: rgba(148,163,184,.1); }
    .danger { background: transparent; color:#fca5a5; border-color: rgba(239,68,68,.4); }
    .danger:hover { background: rgba(239,68,68,.1); }
    .foot { margin-top: 20px; font-size:12px; color:#64748b; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">⚠ Trust Shield blocked this page</span>
    <h1 id="title">This site looks dangerous</h1>
    <p class="sub">Trust Shield stopped the page from loading because it matches patterns commonly used in scams, phishing, or malware.</p>
    <div class="url" id="url">—</div>
    <div class="risk"><span id="riskLabel">Risk</span><div class="bar"><div class="fill" id="fill" style="width:0%"></div></div><strong id="riskNum">0</strong></div>
    <div><strong>Why it was flagged</strong></div>
    <ul id="reasons"></ul>
    <div class="btns">
      <button class="primary" id="back">← Go back to safety</button>
      <button class="ghost" id="allowOnce">Continue anyway (once)</button>
      <button class="danger" id="allowAlways">Always allow this site</button>
    </div>
    <div class="foot">Trust Shield • Protecting your browsing</div>
  </div>

  <script src="warning.js"></script>
</body>
</html>
